# Quality + security gate. Runs on every pull request, and is reused by
# deploy.yml so that nothing reaches GitHub Pages without passing it first.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  RUFF_VERSION: '0.17.4'
  SEMGREP_VERSION: '1.184.0'
  ZIZMOR_VERSION: '1.32.0'

jobs:
  lint:
    name: Lint (JS, CSS, HTML, Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci --ignore-scripts
      - name: ESLint
        run: npm run lint:js
      - name: Stylelint
        run: npm run lint:css
      - name: HTML validation (includes SRI check on CDN assets)
        run: npm run lint:html
      - name: Tests (API against in-memory Postgres, browser helpers, transit search)
        run: npm test
      - name: Ruff (Python build scripts)
        run: pip install "ruff==${RUFF_VERSION}" && ruff check scripts

  e2e:
    name: Browser tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # The browser build is pinned by the exact @playwright/test version in package-lock.json.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Starts the dev server itself. OneMap and the CDN are answered locally: no network needed.
      - name: Browser tests (page against the real API, in-memory Postgres)
        run: npm run e2e

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci --ignore-scripts
      - name: Prettier
        run: npm run format:check
      - name: Ruff format
        run: pip install "ruff==${RUFF_VERSION}" && ruff format --check scripts

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan history, not just the tip
          persist-credentials: false
      # The binary is run directly (not via gitleaks-action) so the whole history
      # is scanned on every run. The action scans a before..after range, which
      # errors out on a repository's first push.
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
      - name: Scan full git history
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --verbose --no-banner .'

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Semgrep
        run: |
          pip install "semgrep==${SEMGREP_VERSION}"
          semgrep scan --error --metrics=off \
            --config p/javascript --config p/python --config p/owasp-top-ten \
            --exclude data --exclude node_modules --exclude _site \
            .

  supply-chain:
    name: Dependencies and workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: npm audit (dev toolchain)
        run: npm audit --audit-level=high
      - name: zizmor (audits these workflow files)
        run: |
          pip install "zizmor==${ZIZMOR_VERSION}"
          zizmor --no-online-audits --min-severity medium .github

  site:
    name: Build and verify artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Assemble _site from the allowlist
        run: npm run build
      - name: Check artifact (allowlist, secrets, broken references)
        run: npm run check:site
